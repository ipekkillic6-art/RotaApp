name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: tsc · guard · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Mimari guard (lint)
        run: npm run lint:guard

      - name: Testler
        run: npm test
